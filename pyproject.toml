[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personaplex-agent"
version = "0.1.0"
description = "Native action/result-state research layer for PersonaPlex."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "PersonaPlex-Agent contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
